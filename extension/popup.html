<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 350px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    .logo {
      font-size: 32px;
      text-align: center;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 18px;
      text-align: center;
      color: #1f2937;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
    }
    .status {
      background: #f0fdf4;
      border: 1px solid #86efac;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 16px;
    }
    .status-icon {
      font-size: 20px;
      margin-bottom: 4px;
    }
    .status-text {
      font-size: 13px;
      color: #166534;
      font-weight: 600;
    }
    .action-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: transform 0.2s;
    }
    .action-btn:hover {
      transform: translateY(-2px);
    }
    .settings-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .settings-btn:hover {
      background: #f9fafb;
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🛡️</div>
    <h1>SAFNEX NOVA</h1>
    <div class="subtitle">Link Guard Extension</div>

    <div class="status">
      <div class="status-icon">✓</div>
      <div class="status-text">Protection Active</div>
    </div>

    <button class="action-btn" onclick="openDashboard()">
      Open Dashboard
    </button>

    <button class="settings-btn" onclick="openSettings()">
      Extension Settings
    </button>

    <div class="footer">
      v1.0.0 | Protected by SAFNEX
    </div>
  </div>

  <script>
    function openDashboard() {
      chrome.tabs.create({ url: 'https://safnex-nova.onrender.com/home.html' });
    }

    function openSettings() {
      chrome.runtime.openOptionsPage();
    }
  </script>
</body>
</html>
