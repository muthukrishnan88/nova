<!DOCTYPE html>
<html>
<head>
  <title>Generate SAFNEX Icons</title>
  <style>
    body { font-family: Arial; padding: 40px; background: #1a1d29; color: white; text-align: center; }
    h1 { color: #667eea; }
    button { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 20px 40px; font-size: 18px; border-radius: 10px; cursor: pointer; margin: 20px; }
    button:hover { transform: scale(1.05); }
    .info { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin: 20px auto; max-width: 600px; }
    .success { color: #22c55e; font-weight: bold; margin: 20px; }
    canvas { display: none; }
  </style>
</head>
<body>
  <h1>🛡️ SAFNEX Icon Generator</h1>
  <div class="info">
    Click the button below to generate all 3 icon sizes (16x16, 48x48, 128x128).
    <br>They will download automatically.
  </div>
  <button onclick="generateIcons()">Generate Icons</button>
  <div id="status"></div>
  <canvas id="canvas"></canvas>

  <script>
    function generateIcons() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');

      const sizes = [16, 48, 128];
      let count = 0;

      sizes.forEach((size, index) => {
        setTimeout(() => {
          canvas.width = size;
          canvas.height = size;

          // Gradient background
          const gradient = ctx.createLinearGradient(0, 0, size, size);
          gradient.addColorStop(0, '#667eea');
          gradient.addColorStop(1, '#764ba2');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, size, size);

          // White shield/circle
          ctx.strokeStyle = 'white';
          ctx.lineWidth = Math.max(2, size / 16);
          ctx.beginPath();
          const centerX = size / 2;
          const centerY = size / 2;
          const radius = size / 3;
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.stroke();

          // White checkmark
          ctx.strokeStyle = 'white';
          ctx.lineWidth = Math.max(2, size / 20);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Draw check
          ctx.beginPath();
          ctx.moveTo(centerX - radius/2, centerY);
          ctx.lineTo(centerX - radius/6, centerY + radius/3);
          ctx.lineTo(centerX + radius/2, centerY - radius/3);
          ctx.stroke();

          // Download
          canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `icon${size}.png`;
            a.click();
            URL.revokeObjectURL(url);

            count++;
            status.innerHTML = `<div class="success">✓ Downloaded ${count}/3 icons</div>`;

            if (count === 3) {
              status.innerHTML += '<div class="info">All icons generated! Move them to the /extension folder, then load the extension in Chrome.</div>';
            }
          });
        }, index * 500);
      });
    }
  </script>
</body>
</html>
